networks: 
  laravel:
    driver: bridge

services: 
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    tty: true
    ports:
      - "8000:8000"
    volumes: 
      - ./backend:/var/www/app
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: 
      - php
      - mysql
    networks: 
      - laravel

  mysql:
    platform: linux/amd64
    image: mysql
    container_name: mysql
    restart: unless-stopped
    tty: true
    ports: 
      - "3306:3306"
    volumes: 
      - mysql-data:/var/lib/mysql
    environment: 
      MYSQL_DATABASE: laravel_docker
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    networks: 
      - laravel

  php:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: php
    restart: unless-stopped
    tty: true
    working_dir: /var/www/app
    volumes: 
      - ./backend:/var/www/app
    ports: 
      - "9000:9000"
    networks: 
      - laravel
  
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    #volumes:
      #- ./frontend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - php
    networks:
      - laravel

volumes:
  mysql-data: